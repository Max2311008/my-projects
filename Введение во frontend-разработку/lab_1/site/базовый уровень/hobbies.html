<!DOCTYPE html> <!-- Объявляет тип документа(HTML5) -->
<html lang="ru"> <!-- Указывает, что язык документа - русский -->
<head> <!-- Содержит информацию о документе -->
    <meta charset="UTF-8"> <!-- Указывает кодировку документа -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Настройка для мобильных устройств -->
    <title>Увлечения</title> <!-- Заголовок страницы -->
</head> <!-- Закрытие информации о документе -->
<body> <!-- видимое содержимое страницы -->
    <h1>Мои увлечения</h1> <!-- Заголовок 1 -->

    <p>В своё свободное время мне нравиться заниматься очень интересными делами.<br>Они помогают мне получить удовольствие и раслабиться после длительной работы </p> .<!-- создание абзаца, перенос строки на новую строку -->
    <h2> Хобби </h2> <!-- Заголовок 2 -->
    <ol>  <!-- создание нумерованного списка -->
        <li>Программирование</li> <!-- отметка каждого элемента списка -->
        <li>Волейбол</li>
        <li>Изучение строения компьютера</li>
    </ol>  <!-- закрытие нумерованного списка -->
</body> <!-- закрывает видимое содержание страницы -->
</html> <!-- Закрывает информацию о документе -->
